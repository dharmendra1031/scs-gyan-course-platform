{% extends "base.html" %}
{% block title %}Reset Password | SCS Gyan{% endblock %}
{% block robots_meta %}<meta name="robots" content="noindex,nofollow">{% endblock %}
{% block content %}
<section class="section"><div class="container"><div class="auth-card">
  <h1>Reset your password</h1><p>Enter your registered email to request a reset link.</p>
  <form method="post">{% csrf_token %}<div class="form-fields">{{ form.as_div }}</div>
    <button class="button button-primary full-width" type="submit">Request reset link</button>
  </form><p><a href="{% url 'login' %}">Back to sign in</a></p>
</div></div></section>
{% endblock %}
